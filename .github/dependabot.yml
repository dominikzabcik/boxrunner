# Weekly grouped minor and patch updates with a cooldown, so a release has
# a week to be pulled before it lands here. Each major update gets its own
# pull request, since it can break the build. Security updates are not held
# back.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories: [/worker, /site]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
