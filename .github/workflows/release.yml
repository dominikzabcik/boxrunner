name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      # Checks what ships: a binary built with a Go release that has a known
      # vulnerability in code it contains does not get published.
      - name: Known vulnerabilities in the binaries
        run: |
          for bin in dist/boxrunner-linux-*; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode binary "$bin"
          done

      # Sigstore attestations for private repositories need GitHub Enterprise,
      # so they start once the repository is public.
      - name: Attest the build
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/boxrunner-linux-*
            dist/install.sh

      # A draft first, so the release is complete before anyone can see it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${pre[@]}" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # The Deploy button deploys the Worker from the stable branch, so a Worker
      # deployed today matches the agent the installer downloads today.
      - name: Move stable to this release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$GITHUB_SHA" -F force=false
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$GITHUB_SHA"
          fi
