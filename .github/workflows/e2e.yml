name: End to end

# Installs, checks, reinstalls and uninstalls boxrunner on fresh GitHub VMs
# with scripts/e2e/run.sh. It changes the machine it runs on, so it runs only
# on GitHub-hosted runners, never on a box of ours.
on:
  pull_request:
    paths:
      - cmd/**
      - internal/agent/**
      - internal/cache/**
      - internal/install/**
      - internal/firewall/**
      - internal/doctor/**
      - internal/dnsfwd/**
      - internal/egress/**
      - internal/nflog/**
      - internal/layout/**
      - image/**
      - install.sh
      - scripts/build-release.sh
      - scripts/e2e/**
      - .github/workflows/e2e.yml
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.os }}, ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
        mode: [runc, sysbox, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The cache test needs a runtime token that GitHub signed, and only
      # JavaScript actions get one.
      - name: Hand the job's runtime token to the cache test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/runtime-token`, process.env.ACTIONS_RUNTIME_TOKEN, { mode: 0o600 });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/results-url`, process.env.ACTIONS_RESULTS_URL);
      - name: Install, doctor, install again, uninstall
        env:
          MODE: ${{ matrix.mode }}
        run: RUNTIME_TOKEN_FILE="$RUNNER_TEMP/runtime-token" RESULTS_URL_FILE="$RUNNER_TEMP/results-url" scripts/e2e/run.sh "$MODE"
