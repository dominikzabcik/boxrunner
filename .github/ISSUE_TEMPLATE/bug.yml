name: Bug report
description: Something boxrunner does wrong
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Found a security problem? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sudo boxrunner doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Agent log around the problem
      description: "`journalctl -u boxrunner --since '-30 min'`. Remove anything private first."
      render: text
  - type: input
    id: version
    attributes:
      label: boxrunner version
      placeholder: "boxrunner version"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Distribution, kernel and architecture
      placeholder: "Ubuntu 24.04, 6.8.0, arm64"
    validations:
      required: true
